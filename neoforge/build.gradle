plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("com.geckolib")
        }
    }
}

dependencies {
    implementation "com.geckolib:geckolib-neoforge-${geckolib_minecraft_version}:${geckolib_version}"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }
if (providers.gradleProperty('clientSmokeTest').isPresent()) {
    sourceSets {
        clienttest {
            java.srcDir project(':common').file('src/clienttest/java')
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    neoForge {
        mods {
            jdturrets_clienttest { sourceSet sourceSets.clienttest }
        }
        runs {
            clientSmokeTest {
                client()
                sourceSet = sourceSets.clienttest
                gameDirectory = layout.buildDirectory.dir('client-smoke').get().asFile
                systemProperty('jdturrets.clientSmokeTest', 'true')
            }
        }
    }
}
